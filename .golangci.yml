# golangci-lint configuration for Mizan ERP and Mizan Lite — golangci-lint v2.
#
# This covers the STANDARD, well-known rules. Mizan-specific architectural invariants
# (layer boundaries, no-float-in-money, forbidden calls by location) are enforced by the
# separate extensible framework in tools/archlint — see tools/archlint/README.md.
# Together they mean architecture is enforced by tooling, not code review.
#
# # Why v2 (2026-09-13)
#
# Go 1.27 writes export data version 4. golangci-lint v1.64.8 bundles a reader that stops at version 2,
# so under Go 1.27 every package — even the standard library's `errors` — failed to type-check and every
# finding was false. Found while building Mizan Lite's Phase L0 (finding F2 in its phase record).
#
# Converted with `golangci-lint migrate` and then re-commented by hand (the tool drops comments). The
# linter set and settings are unchanged. Two things moved rather than changed:
#   - gosimple is part of staticcheck in v2, so enabling staticcheck keeps its checks;
#   - v1 applied a set of default exclusions implicitly; v2 names them as `presets` below. They are kept so
#     the upgrade changes the TOOL and not the rules — tightening them is a separate, deliberate decision.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet            # correctness vetting
    - staticcheck      # the big static-analysis suite (includes v1's gosimple)
    - errcheck         # unchecked errors
    - ineffassign      # ineffectual assignments
    - unused           # dead code
    - contextcheck     # context.Context is propagated correctly
    - sloglint         # structured logging hygiene (log/slog)
    - forbidigo        # forbidden identifiers (see below)
    - bodyclose        # HTTP bodies closed
    - rowserrcheck     # sql.Rows errors checked
    - sqlclosecheck    # sql.Rows/Stmt closed
    - gocritic         # opinionated correctness/style
    - revive           # style, replaces golint
    - misspell
    - unconvert
    - wastedassign
    - nilerr
    - predeclared      # no shadowing of predeclared identifiers

  settings:
    forbidigo:
      # Backstop for the arch rules; archlint is the location-aware authority.
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use log/slog for output, not fmt.Print*
      exclude-godoc-examples: true
      analyze-types: true

    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: true
      context: scope
      static-msg: false
      key-naming-case: snake

    govet:
      enable-all: true
      disable:
        - fieldalignment   # not worth the churn at this stage

    staticcheck:
      checks:
        - all
        # QF1001 suggests rewriting `!(a && b)` by De Morgan's law. Added to staticcheck after v1, and a
        # quickfix rather than a defect: `!(sqlText[i] == '*' && sqlText[i+1] == '/')` reads as "not the
        # closing delimiter", which the rewritten `!= … || != …` hides. Disabled so the upgrade keeps v1's
        # rules; the checks v1's staticcheck ran all still run.
        - -QF1001
        # The rest is v2's own default for staticcheck, spelled out because listing `checks` replaces it.
        # v2's staticcheck absorbs v1's separate gosimple and stylecheck; stylecheck was never enabled here,
        # so its ST checks are NEW. On the first v2 run they found one thing (ST1023, fixed).
        # Excluded by that default: package-comment format (ST1000), identifier and initialism style
        # (ST1003), receiver names (ST1016), comment forms on exported identifiers (ST1020–ST1022).
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

    revive:
      rules:
        - name: exported
          disabled: true   # doc.go markers are intentionally sparse during scaffolding

  exclusions:
    generated: lax
    # v1's implicit default exclusions, made explicit by the migration (see the header).
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may use fmt and are less strict.
      - path: _test\.go
        linters: [forbidigo, errcheck]
      # Tests drive time and cancellation deliberately from context.Background(), and close stores whose
      # Close takes no context by design (platform/database: a checkpoint-and-close must complete even when
      # the caller's context is cancelled). contextcheck's "should pass the context" has nothing to find.
      - path: _test\.go
        linters: [contextcheck]
      # The arch-lint tool is a CLI; fmt/os.Exit are legitimate there.
      - path: tools/archlint/
        linters: [forbidigo]
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
