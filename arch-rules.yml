# Mizan ERP — Architecture rules (data-driven).
#
# These rules are enforced by tools/archlint (see tools/archlint/README.md).
# They are DATA: adding or tuning a rule here changes enforcement without touching Go code,
# as long as the rule *kind* already exists. Adding a brand-new rule *kind* is one Go file
# plus a registry line — the framework itself is not redesigned.
#
# Pattern syntax (doublestar-style):
#   *   matches within a single path segment
#   **  matches across segments
#   the token `std` in an import allowlist means "any Go standard-library package"
#   the token `self` expands to the module path (github.com/mizan-erp/mizan)

module: github.com/mizan-erp/mizan

rules:
  # ── Layer & module import boundaries ────────────────────────────────────────
  import-boundary:
    enabled: true
    boundaries:
      - name: kernel-purity
        description: The kernel is pure; it may import only stdlib, itself, and uuid.
        applies_to: ["self/internal/kernel/**"]
        allow_only: ["std", "self/internal/kernel/**", "github.com/google/uuid"]
        message: "kernel packages may import only stdlib, other kernel packages, and google/uuid"

      - name: domain-purity
        description: Domain layers hold business rules only; no infrastructure.
        applies_to: ["self/internal/modules/*/domain/**"]
        allow_only: ["std", "self/internal/kernel/**", "self/internal/modules/*/domain/**"]
        message: "domain packages may import only stdlib, kernel, and their own module's domain"

      - name: no-driver-outside-infra
        description: SQL drivers and Wails belong to infrastructure, never domain/app.
        applies_to: ["self/internal/modules/*/domain/**", "self/internal/modules/*/app/**"]
        forbid: ["modernc.org/sqlite**", "github.com/wailsapp/**", "database/sql"]
        message: "database drivers and Wails may be imported only from infra/platform layers"

      # Added in Step 0.5. Dependencies point inward: platform is reusable infrastructure
      # that knows nothing about any business module. Without this, a "small" import of a
      # module type into platform/config or platform/strategy would quietly invert the
      # architecture and make the configuration mechanisms un-reusable.
      - name: platform-independent-of-modules
        description: Platform infrastructure must never depend on a business module.
        applies_to: ["self/internal/platform/**"]
        forbid: ["self/internal/modules/**", "self/internal/api/**"]
        message: "platform must not import business modules or the API layer — dependencies point inward"

      # Added in Step 0.5. The dialect shim is the ENTIRE portability surface (§8.5): a
      # module that reaches for it is writing engine-aware code, which is precisely what
      # would make the future PostgreSQL port a rewrite instead of one new dialect.
      - name: dialect-is-platform-only
        description: Only the database platform may be dialect-aware.
        applies_to: ["self/internal/modules/**", "self/internal/api/**", "self/internal/lite/**"]
        forbid: ["self/internal/platform/database/dialect**"]
        message: "only platform/database may be dialect-aware (ARCHITECTURE_v1 §8.5)"

      # ── Mizan Lite (docs/mizan_lite/DESIGN.md §6.2) ───────────────────────────
      # The edition boundary, in both directions. Lite reuses Mizan's kernel and a named set of
      # platform packages and nothing else — never a business module, never Mizan's bindings or
      # composition root — so it cannot quietly grow a dependency on the full ERP. And nothing in Mizan
      # may depend on Lite. Each rule was seen FAILING by planting a violation (scripts/lite-arch-drill.sh
      # does it on every lite-ci run), because a rule nobody has watched fail may match nothing.
      - name: lite-edition-boundary
        description: Mizan Lite imports only the kernel, its named platform packages, the envelope, and itself.
        applies_to: ["self/internal/lite/**"]
        allow_only:
          - "std"
          - "self/internal/kernel/**"
          - "self/internal/platform/database"
          - "self/internal/platform/migrate"
          - "self/internal/platform/backup"
          - "self/internal/platform/jobs"
          - "self/internal/platform/i18n"
          # L1 (D-L1.6): Argon2id for the owner PIN — reuse of Mizan's tested hasher, not a second one.
          - "self/internal/platform/crypto"
          - "self/internal/api/envelope"
          - "self/internal/lite/**"
          # L7 (A-L7.3): Arabic shaping and glyph outlines for printouts, confined to internal/lite/typeset by lite-typeset-only.
          - "github.com/go-text/typesetting/**"
          - "golang.org/x/image/**"
        message: "Mizan Lite may import only the kernel, platform/{database,migrate,backup,jobs,i18n,crypto}, api/envelope, internal/lite, and — in typeset — go-text/typesetting and x/image (design §3.1, §6.2, L7 A-L7.3)"

      - name: mizan-independent-of-lite
        description: Nothing in Mizan depends on Mizan Lite.
        applies_to:
          - "self"
          - "self/internal/kernel/**"
          - "self/internal/platform/**"
          - "self/internal/modules/**"
          - "self/internal/api/**"
          - "self/internal/bootstrap/**"
          - "self/internal/buildinfo/**"
          # Mizan's own commands only: cmd/lite-demoseed is Lite's and must import it (L1 §11).
          - "self/cmd/demoseed/**"
          - "self/tools/**"
        forbid: ["self/internal/lite/**", "self/apps/**"]
        message: "Mizan must not import Mizan Lite — the dependency runs one way"

      - name: lite-app-entry
        description: The Lite desktop entry point wires Wails to Lite and holds nothing else.
        applies_to: ["self/apps/lite/**"]
        allow_only: ["std", "github.com/wailsapp/wails/v2/**", "self/internal/lite/**", "self/internal/kernel/errs"]
        message: "apps/lite may import only the standard library, Wails and internal/lite"

      - name: lite-domain-purity
        description: Lite domain packages hold rules only; no infrastructure.
        applies_to: ["self/internal/lite/*/domain/**"]
        # textkey and numinput are Lite's two PURE text packages — Arabic normalisation and typed-number
        # normalisation — and they are what a domain rule is made of ("a name made only of marks is
        # missing"; "a price has no more decimals than its currency"). lite-pure-text keeps them pure.
        allow_only:
          - "std"
          - "self/internal/kernel/**"
          - "self/internal/lite/*/domain/**"
          - "self/internal/lite/textkey"
          - "self/internal/lite/numinput"
          - "self/internal/lite/tender"
        message: "Lite domain packages may import only stdlib, kernel, textkey, numinput, tender and Lite domain packages"

      - name: lite-pure-text
        description: textkey, numinput, bizdate and tender stay pure, so domains and services may depend on them.
        # bizdate joined in L2: every stock movement's business date comes from it, and a clock or a database
        # reaching it would make "which day is this" depend on something other than the instant and the zone.
        # tender joined in L5: the till's change and the debt book's repayments round through it (L5 §10.2).
        applies_to: ["self/internal/lite/textkey/**", "self/internal/lite/numinput/**", "self/internal/lite/bizdate/**", "self/internal/lite/tender/**"]
        allow_only: ["std", "self/internal/kernel/errs"]
        message: "textkey, numinput, bizdate and tender may import only the standard library and kernel/errs — domain packages and services depend on them"

      - name: lite-cmd-entry
        description: Lite's commands wire internal/lite and hold nothing else.
        applies_to: ["self/cmd/lite-demoseed/**"]
        allow_only: ["std", "self/internal/lite/**"]
        message: "cmd/lite-demoseed may import only the standard library and internal/lite"

      # ── Lite module isolation (DESIGN §13.3 A10, L1 §11) ──────────────────────
      # Modules import none of each other. Only the orchestrators — bootstrap, api, setup, demoseed — and the
      # till, sales (L4), through its own ports — reach several, and a module reaches another only through a port it declares itself
      # (catalog.OwnerGate). Written in L1 because it needed two modules to plant a violation between.
      - name: lite-catalog-isolated
        description: The catalogue imports no other Lite module.
        applies_to: ["self/internal/lite/catalog/**"]
        forbid:
          - "self/internal/lite/fx/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "catalog may not import another Lite module — declare a port (see catalog.OwnerGate)"

      - name: lite-owner-isolated
        description: The owner module imports no other Lite module.
        applies_to: ["self/internal/lite/owner/**"]
        forbid:
          - "self/internal/lite/fx/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "owner may not import another Lite module — it must not learn what it guards"

      - name: lite-settings-isolated
        description: The settings module imports no other Lite module.
        applies_to: ["self/internal/lite/settings/**"]
        forbid:
          - "self/internal/lite/fx/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "settings may not import another Lite module"

      - name: lite-setup-reaches-only-its-ports
        description: First run orchestrates settings and owner, and nothing it has no reason to know.
        applies_to: ["self/internal/lite/setup/**"]
        forbid:
          - "self/internal/lite/fx/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "setup may reach other modules only through the ports it declares"

      - name: lite-stock-isolated
        description: Stock imports no other Lite module; it reaches products and the owner through ports it declares.
        applies_to: ["self/internal/lite/stock/**"]
        forbid:
          - "self/internal/lite/fx/**"
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "stock may not import another Lite module — declare a port (see stock.Catalogue and stock.OwnerGate)"

      - name: lite-fx-isolated
        description: The exchange-rate module imports no other Lite module; it reaches settings and the owner through ports.
        applies_to: ["self/internal/lite/fx/**"]
        forbid:
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "fx may not import another Lite module — declare a port (see fx.Settings and fx.OwnerGate)"

      - name: lite-sales-isolated
        description: >
          The till imports no other Lite module. It reaches products, stock, the rate, settings and the owner through the
          five ports it declares (L4 §9.1) — the module that touches the most modules is the one most tempted to import them.
        applies_to: ["self/internal/lite/sales/**"]
        forbid:
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/fx/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "sales may not import another Lite module — declare a port (see sales.Catalogue, sales.Stock, sales.Rates)"

      - name: lite-customers-isolated
        description: >
          The debt book imports no other Lite module. It reaches the rate, settings, the currencies and the owner through
          the ports it declares; the till reaches it through the Debts port the till declares (L5 §10.1).
        applies_to: ["self/internal/lite/customers/**"]
        forbid:
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/fx/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "customers may not import another Lite module — declare a port (see customers.Rates and customers.OwnerGate)"

      - name: lite-cashbook-isolated
        description: >
          The cash book imports no other Lite module. It reaches the rate, the currencies, the owner and — for a count's
          expected figure — the reports through the ports it declares (L6 §9.2).
        applies_to: ["self/internal/lite/cashbook/**"]
        forbid:
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/fx/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "cashbook may not import another Lite module — declare a port (see cashbook.Expected)"

      - name: lite-reports-isolated
        description: >
          The reports import no module. Every fact arrives through a port the reports declare, satisfied in the composition
          root by the module that owns the table — so SQL stays with its owner and the reports cannot write (L6 §9.1, §9.3).
        applies_to: ["self/internal/lite/reports/**"]
        forbid:
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/fx/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "reports may not import another Lite module — declare a facts port (see reports.Sales)"

      - name: lite-printing-isolated
        description: The printing module (print jobs, voucher numbers) imports no other Lite module (L7 §8).
        applies_to: ["self/internal/lite/printing/**"]
        forbid:
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/fx/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/backups/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "printing may not import another Lite module — the customers module reaches it through its Vouchers port"

      - name: lite-backups-isolated
        description: >
          The backups module imports no other Lite module; it reaches settings, the owner and the facts it counts through ports
          (L7 §8), and platform/backup beneath it.
        applies_to: ["self/internal/lite/backups/**"]
        forbid:
          - "self/internal/lite/catalog/**"
          - "self/internal/lite/stock/**"
          - "self/internal/lite/fx/**"
          - "self/internal/lite/owner/**"
          - "self/internal/lite/settings/**"
          - "self/internal/lite/setup/**"
          - "self/internal/lite/sales/**"
          - "self/internal/lite/customers/**"
          - "self/internal/lite/cashbook/**"
          - "self/internal/lite/reports/**"
          - "self/internal/lite/printing/**"
          - "self/internal/lite/api/**"
          - "self/internal/lite/bootstrap/**"
          - "self/internal/lite/demoseed/**"
        message: "backups may not import another Lite module — declare a port (see backups.Activity)"

      - name: lite-typeset-only
        description: >
          One package shapes text: internal/lite/typeset. go-text/typesetting and x/image enter the edition there and nowhere else
          (L7 A-L7.3), so a second shaper or rasteriser is a decision, not a drift.
        applies_to: ["self/internal/lite/**", "self/apps/lite/**", "self/cmd/lite-demoseed/**"]
        except: ["self/internal/lite/typeset"]
        forbid: ["github.com/go-text/typesetting/**", "golang.org/x/image/**"]
        message: "only internal/lite/typeset may import go-text/typesetting or x/image"

      - name: lite-os-calls-only-in-printers
        description: >
          One package calls the operating system: internal/lite/printers — CUPS through os/exec, the Windows spooler and GDI through
          syscall (L7 A-L7.4). Anything else in internal/lite that runs a program or a system call is a feature nobody reviewed as one.
        applies_to: ["self/internal/lite/**"]
        except: ["self/internal/lite/printers"]
        forbid: ["os/exec", "syscall", "unsafe"]
        message: "only internal/lite/printers may use os/exec, syscall or unsafe"

      - name: lite-documents-pure
        description: documents and sheets render values to bytes — no database, no clock, no operating system, no module (L7 §8).
        applies_to: ["self/internal/lite/documents/**", "self/internal/lite/sheets/**"]
        allow_only: ["std", "self/internal/kernel/errs", "self/internal/lite/typeset"]
        message: "documents and sheets may import only the standard library, kernel/errs and typeset"

      - name: lite-network-only-in-httpsource
        description: >
          One package reaches the internet: fx/infra/httpsource, the exchange-rate providers (L3 §14.6). Anything else in
          Lite that opens a connection is a feature nobody reviewed as one — and a test that could reach the network.
        applies_to: ["self/internal/lite/**", "self/cmd/lite-demoseed/**"]
        except: ["self/internal/lite/fx/infra/httpsource"]
        forbid: ["net", "net/http", "net/http/**", "net/rpc", "net/smtp"]
        message: "only internal/lite/fx/infra/httpsource may open network connections"

  # ── Forbidden calls, scoped by location ─────────────────────────────────────
  forbid-call:
    enabled: true
    calls:
      - selector: "panic"
        applies_to: ["self/**"]
        # Exempt: tooling; the bootstrap recover boundary; the dbtest harness (which
        # deliberately induces a panic to test rollback); and uow.go, whose recover
        # rolls back the transaction and RE-RAISES the original panic (with its stack)
        # so it reaches the binding-layer recover — cleanup, not control flow.
        exclude: ["**/tools/**", "**/bootstrap/**", "**/dbtest/**", "**/database/uow.go", "**_test.go"]
        message: "no panic() in production code — return a typed kernel/errs error instead"

      - selector: "os.Exit"
        applies_to: ["self/**"]
        # A package main's entrypoint IS the application bootstrap — the one place a non-zero
        # exit code is the correct way to report that the program cannot run. Added when Step
        # 1.12 widened the scan to the repository root and found the rule firing on the very
        # entrypoint it was written to permit.
        exclude: ["**/main.go", "**/cmd/**", "**/bootstrap/**", "**/tools/**", "**_test.go"]
        message: "no os.Exit() outside the application bootstrap"

      - selector: "fmt.Println"
        applies_to: ["self/internal/**"]
        exclude: ["**_test.go"]
        message: "use structured logging (log/slog), not fmt.Println"

      - selector: "fmt.Print"
        applies_to: ["self/internal/**"]
        exclude: ["**_test.go"]
        message: "use structured logging (log/slog), not fmt.Print"

      - selector: "fmt.Printf"
        applies_to: ["self/internal/**"]
        exclude: ["**_test.go"]
        message: "use structured logging (log/slog), not fmt.Printf"

      - selector: "time.Now"
        # Lite in full, not only its domains: Lite is small enough that every time-dependent path —
        # backups' minimum age, a sale's business date — must take an injected clock to be testable.
        applies_to: ["self/internal/modules/*/domain/**", "self/internal/kernel/money/**", "self/internal/lite/**"]
        exclude: ["**_test.go", "**/clock/**"]
        message: "do not call time.Now() in domain code — take a kernel/clock.Clock"

  # ── Module isolation (added in Step 1.1) ────────────────────────────────────
  # ARCHITECTURE_v1 §3.2: a module exports a small `contract` package of interfaces and
  # DTOs and NEVER its aggregates — "Sales must not be able to construct an
  # inventory.StockLevel". §3.1 names silent module-to-module coupling as "the single most
  # common way an ERP becomes unmaintainable".
  #
  # Landed in Step 1.1 deliberately, BEFORE Phase 1's three new modules are written: the
  # cheapest moment to forbid an import is before anyone has written it. It also turned out
  # not to need the whole-program pass this file assumed for three steps (Step 1.1, D2).
  module-isolation:
    enabled: true
    modules_root: "self/internal/modules"
    contract_dir: "contract"
    message: "a module may import another module only through its /contract package (§3.2)"

  # ── No SQL in domain / app / api (added in Step 1.1) ────────────────────────
  # REPO.3 rule 7, restated. The original wording ("outside infra") predates the platform
  # packages that legitimately own their own tables, and Step 0.12 found it unenforceable as
  # written. The enforceable intent: business rules and the API boundary must not know how
  # anything is stored (§5.1, §5.3, §5.4).
  #
  # A tripwire, not a proof — concatenated SQL evades a literal scan. domain-purity is the
  # structural defence for domain packages; this covers app and api too.
  no-sql:
    enabled: true
    applies_to:
      - "self/internal/modules/*/domain/**"
      - "self/internal/modules/*/app/**"
      - "self/internal/api/**"
      # Lite: SQL lives only in each module's infra/sqlite package and in migrations. `lite/*` is a
      # module's service package (one segment), which never reaches its own infra/sqlite (three).
      - "self/internal/lite/*"
      - "self/internal/lite/*/domain/**"
    message: "SQL belongs to infra/platform — domain, app, and api must not contain it"

  # ── No floating-point in money/domain ───────────────────────────────────────
  no-float:
    enabled: true
    applies_to:
      - "self/internal/kernel/**"
      - "self/internal/modules/*/domain/**"
      # All of Lite, not only its domains: a till's arithmetic can leak through any layer.
      - "self/internal/lite/**"
    # L7: typeset and documents measure pages in points and pixels for a shaper and a rasteriser that take floats. They receive
    # money only as strings Go already formatted, and compute none; everything else in Lite stays float-free.
    except:
      - "self/internal/lite/typeset"
      - "self/internal/lite/documents"
