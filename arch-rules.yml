# Mizan ERP — Architecture rules (data-driven).
#
# These rules are enforced by tools/archlint (see tools/archlint/README.md).
# They are DATA: adding or tuning a rule here changes enforcement without touching Go code,
# as long as the rule *kind* already exists. Adding a brand-new rule *kind* is one Go file
# plus a registry line — the framework itself is not redesigned.
#
# Pattern syntax (doublestar-style):
#   *   matches within a single path segment
#   **  matches across segments
#   the token `std` in an import allowlist means "any Go standard-library package"
#   the token `self` expands to the module path (github.com/mizan-erp/mizan)

module: github.com/mizan-erp/mizan

rules:
  # ── Layer & module import boundaries ────────────────────────────────────────
  import-boundary:
    enabled: true
    boundaries:
      - name: kernel-purity
        description: The kernel is pure; it may import only stdlib, itself, and uuid.
        applies_to: ["self/internal/kernel/**"]
        allow_only: ["std", "self/internal/kernel/**", "github.com/google/uuid"]
        message: "kernel packages may import only stdlib, other kernel packages, and google/uuid"

      - name: domain-purity
        description: Domain layers hold business rules only; no infrastructure.
        applies_to: ["self/internal/modules/*/domain/**"]
        allow_only: ["std", "self/internal/kernel/**", "self/internal/modules/*/domain/**"]
        message: "domain packages may import only stdlib, kernel, and their own module's domain"

      - name: no-driver-outside-infra
        description: SQL drivers and Wails belong to infrastructure, never domain/app.
        applies_to: ["self/internal/modules/*/domain/**", "self/internal/modules/*/app/**"]
        forbid: ["modernc.org/sqlite**", "github.com/wailsapp/**", "database/sql"]
        message: "database drivers and Wails may be imported only from infra/platform layers"

      # Added in Step 0.5. Dependencies point inward: platform is reusable infrastructure
      # that knows nothing about any business module. Without this, a "small" import of a
      # module type into platform/config or platform/strategy would quietly invert the
      # architecture and make the configuration mechanisms un-reusable.
      - name: platform-independent-of-modules
        description: Platform infrastructure must never depend on a business module.
        applies_to: ["self/internal/platform/**"]
        forbid: ["self/internal/modules/**", "self/internal/api/**"]
        message: "platform must not import business modules or the API layer — dependencies point inward"

      # Added in Step 0.5. The dialect shim is the ENTIRE portability surface (§8.5): a
      # module that reaches for it is writing engine-aware code, which is precisely what
      # would make the future PostgreSQL port a rewrite instead of one new dialect.
      - name: dialect-is-platform-only
        description: Only the database platform may be dialect-aware.
        applies_to: ["self/internal/modules/**", "self/internal/api/**", "self/internal/lite/**"]
        forbid: ["self/internal/platform/database/dialect**"]
        message: "only platform/database may be dialect-aware (ARCHITECTURE_v1 §8.5)"

      # ── Mizan Lite (docs/mizan_lite/DESIGN.md §6.2) ───────────────────────────
      # The edition boundary, in both directions. Lite reuses Mizan's kernel and a named set of
      # platform packages and nothing else — never a business module, never Mizan's bindings or
      # composition root — so it cannot quietly grow a dependency on the full ERP. And nothing in Mizan
      # may depend on Lite. Each rule was seen FAILING by planting a violation (scripts/lite-arch-drill.sh
      # does it on every lite-ci run), because a rule nobody has watched fail may match nothing.
      - name: lite-edition-boundary
        description: Mizan Lite imports only the kernel, its named platform packages, the envelope, and itself.
        applies_to: ["self/internal/lite/**"]
        allow_only:
          - "std"
          - "self/internal/kernel/**"
          - "self/internal/platform/database"
          - "self/internal/platform/migrate"
          - "self/internal/platform/backup"
          - "self/internal/platform/jobs"
          - "self/internal/platform/i18n"
          - "self/internal/api/envelope"
          - "self/internal/lite/**"
        message: "Mizan Lite may import only the kernel, platform/{database,migrate,backup,jobs,i18n}, api/envelope and internal/lite (design §3.1, §6.2)"

      - name: mizan-independent-of-lite
        description: Nothing in Mizan depends on Mizan Lite.
        applies_to:
          - "self"
          - "self/internal/kernel/**"
          - "self/internal/platform/**"
          - "self/internal/modules/**"
          - "self/internal/api/**"
          - "self/internal/bootstrap/**"
          - "self/internal/buildinfo/**"
          - "self/cmd/**"
          - "self/tools/**"
        forbid: ["self/internal/lite/**", "self/apps/**"]
        message: "Mizan must not import Mizan Lite — the dependency runs one way"

      - name: lite-app-entry
        description: The Lite desktop entry point wires Wails to Lite and holds nothing else.
        applies_to: ["self/apps/lite/**"]
        allow_only: ["std", "github.com/wailsapp/wails/v2/**", "self/internal/lite/**", "self/internal/kernel/errs"]
        message: "apps/lite may import only the standard library, Wails and internal/lite"

      - name: lite-domain-purity
        description: Lite domain packages hold rules only; no infrastructure.
        applies_to: ["self/internal/lite/*/domain/**"]
        allow_only: ["std", "self/internal/kernel/**", "self/internal/lite/*/domain/**"]
        message: "Lite domain packages may import only stdlib, kernel, and Lite domain packages"

  # ── Forbidden calls, scoped by location ─────────────────────────────────────
  forbid-call:
    enabled: true
    calls:
      - selector: "panic"
        applies_to: ["self/**"]
        # Exempt: tooling; the bootstrap recover boundary; the dbtest harness (which
        # deliberately induces a panic to test rollback); and uow.go, whose recover
        # rolls back the transaction and RE-RAISES the original panic (with its stack)
        # so it reaches the binding-layer recover — cleanup, not control flow.
        exclude: ["**/tools/**", "**/bootstrap/**", "**/dbtest/**", "**/database/uow.go", "**_test.go"]
        message: "no panic() in production code — return a typed kernel/errs error instead"

      - selector: "os.Exit"
        applies_to: ["self/**"]
        # A package main's entrypoint IS the application bootstrap — the one place a non-zero
        # exit code is the correct way to report that the program cannot run. Added when Step
        # 1.12 widened the scan to the repository root and found the rule firing on the very
        # entrypoint it was written to permit.
        exclude: ["**/main.go", "**/cmd/**", "**/bootstrap/**", "**/tools/**", "**_test.go"]
        message: "no os.Exit() outside the application bootstrap"

      - selector: "fmt.Println"
        applies_to: ["self/internal/**"]
        exclude: ["**_test.go"]
        message: "use structured logging (log/slog), not fmt.Println"

      - selector: "fmt.Print"
        applies_to: ["self/internal/**"]
        exclude: ["**_test.go"]
        message: "use structured logging (log/slog), not fmt.Print"

      - selector: "fmt.Printf"
        applies_to: ["self/internal/**"]
        exclude: ["**_test.go"]
        message: "use structured logging (log/slog), not fmt.Printf"

      - selector: "time.Now"
        # Lite in full, not only its domains: Lite is small enough that every time-dependent path —
        # backups' minimum age, a sale's business date — must take an injected clock to be testable.
        applies_to: ["self/internal/modules/*/domain/**", "self/internal/kernel/money/**", "self/internal/lite/**"]
        exclude: ["**_test.go", "**/clock/**"]
        message: "do not call time.Now() in domain code — take a kernel/clock.Clock"

  # ── Module isolation (added in Step 1.1) ────────────────────────────────────
  # ARCHITECTURE_v1 §3.2: a module exports a small `contract` package of interfaces and
  # DTOs and NEVER its aggregates — "Sales must not be able to construct an
  # inventory.StockLevel". §3.1 names silent module-to-module coupling as "the single most
  # common way an ERP becomes unmaintainable".
  #
  # Landed in Step 1.1 deliberately, BEFORE Phase 1's three new modules are written: the
  # cheapest moment to forbid an import is before anyone has written it. It also turned out
  # not to need the whole-program pass this file assumed for three steps (Step 1.1, D2).
  module-isolation:
    enabled: true
    modules_root: "self/internal/modules"
    contract_dir: "contract"
    message: "a module may import another module only through its /contract package (§3.2)"

  # ── No SQL in domain / app / api (added in Step 1.1) ────────────────────────
  # REPO.3 rule 7, restated. The original wording ("outside infra") predates the platform
  # packages that legitimately own their own tables, and Step 0.12 found it unenforceable as
  # written. The enforceable intent: business rules and the API boundary must not know how
  # anything is stored (§5.1, §5.3, §5.4).
  #
  # A tripwire, not a proof — concatenated SQL evades a literal scan. domain-purity is the
  # structural defence for domain packages; this covers app and api too.
  no-sql:
    enabled: true
    applies_to:
      - "self/internal/modules/*/domain/**"
      - "self/internal/modules/*/app/**"
      - "self/internal/api/**"
      # Lite: SQL lives only in each module's infra/sqlite package and in migrations. `lite/*` is a
      # module's service package (one segment), which never reaches its own infra/sqlite (three).
      - "self/internal/lite/*"
      - "self/internal/lite/*/domain/**"
    message: "SQL belongs to infra/platform — domain, app, and api must not contain it"

  # ── No floating-point in money/domain ───────────────────────────────────────
  no-float:
    enabled: true
    applies_to:
      - "self/internal/kernel/**"
      - "self/internal/modules/*/domain/**"
      # All of Lite, not only its domains: a till's arithmetic can leak through any layer.
      - "self/internal/lite/**"
    message: "float32/float64 are forbidden here — use kernel integer money/quantity types"

# ── Planned rule kinds (documented seams, added later without redesign) ────────
# The following require a whole-program package-graph pass (tools/archlint -graph).
# They are listed here as intent; each becomes one registered rule when implemented:
#   (module-isolation graduated to a real rule in Step 1.1 — it needed no graph pass)
#   - max-dependency-depth  : cap the import-chain depth of any package
#   - domain-tests-required : every domain package must have a _test.go
#   - no-package-cycles     : (Go forbids these already at compile time; kept for modules)
